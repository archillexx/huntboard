# Runs on GitHub's machines on every push to main and every pull request.
# Two jobs run side by side; the commit gets a green tick only if both pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # A throwaway Postgres just for this run (deleted afterwards). Tests use it like your local job_tracker_test.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_tracker_test
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the tests start.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Dummy values only: the code needs these at import time, but tests never call OpenAI or Resend
    # (fake client, fake outbox). No real secret is ever stored in GitHub.
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/job_tracker_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/job_tracker_test
      JWT_SECRET: ci-only-not-a-real-secret
      OPENAI_API_KEY: sk-ci-not-a-real-key

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5            # download the repo onto the runner
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"             # same as your laptop and Render
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt # only what requirements.txt says, like Render (your 8.3 lesson)
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "26"                 # same as your laptop and Render
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci                          # exact versions from the lock file
      - run: npm run lint                    # oxlint: fails on errors (warnings still pass)
      - run: npm run build                   # proves the production build still works
